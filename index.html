<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Anagram lite</title>
    <meta name="description" content="Private Nostr DMs and public chat rooms. Compatible with Anagram." />
    <meta name="theme-color" content="#14161a" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
    <script>
      // Apply a chosen theme before first paint so there is no flash.
      try {
        const t = JSON.parse(localStorage.getItem('lite:theme'));
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <script type="importmap">
      {
        "imports": {
          "preact": "https://esm.sh/preact@10.24.3",
          "preact/hooks": "https://esm.sh/preact@10.24.3/hooks",
          "@preact/signals": "https://esm.sh/@preact/signals@1.3.0?external=preact",
          "htm": "https://esm.sh/htm@3.1.1",
          "nostr-tools": "https://esm.sh/nostr-tools@2.25.2",
          "nostr-tools/nip46": "https://esm.sh/nostr-tools@2.25.2/nip46"
        }
      }
    </script>
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Anagram lite needs JavaScript.</noscript>
  </body>
</html>
